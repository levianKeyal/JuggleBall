<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuggleBall Demo</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="demo-page">
        <section class="demo-panel" aria-label="Demo de integracion">
            <h1 class="demo-title">JuggleBall</h1>
            <p class="demo-copy">
                Demo minima de integracion sobre contenido web normal.
            </p>

        </section>
    </main>
    <div class="demo-actions demo-controls" aria-label="Controles de demo">
        <button class="demo-button" type="button" data-action="start">Start</button>
        <button class="demo-button" type="button" data-action="stop">Stop</button>
        <button class="demo-button" type="button" data-action="destroy">Destroy</button>
    </div>
    <script type="module">
        import { JuggleBall } from "../src/JuggleBall.js";

        const controls = document.querySelector(".demo-controls");

        let game = null;

        function keepDemoControlsAboveOverlay() {
            document.body.appendChild(controls);
        }

        function startGame() {
            if (!game) {
                game = new JuggleBall();
            }
            game.start();
            keepDemoControlsAboveOverlay();
        }

        startGame();

        // Diagnostico temporal: compara el dedo y la raqueta en pixeles CSS.
        const debug = document.createElement("pre");
        debug.setAttribute("aria-label", "Diagnostico tactil");
        Object.assign(debug.style, {
            position: "fixed", left: "8px", bottom: "8px", zIndex: "2147483002",
            background: "rgba(0,0,0,.85)", color: "#fff", padding: "8px",
            font: "12px monospace", pointerEvents: "none", margin: "0",
            whiteSpace: "pre-wrap"
        });
        document.body.appendChild(debug);
        function updateDebug() {
            if (game?.running && game.input?.active && game.player) {
                const rect = game.canvas.getBoundingClientRect();
                const scaleY = rect.height / game.canvas.height;
                const fingerY = rect.top + game.input.y * scaleY;
                const paddleY = rect.top + game.player.y * scaleY;
                const distance = fingerY - paddleY;
                debug.textContent = "Dedo Y: " + fingerY.toFixed(1)
                    + "\nRaqueta Y: " + paddleY.toFixed(1)
                    + "\nDistancia: " + distance.toFixed(1) + " px"
                    + "\nEscala Y: " + scaleY.toFixed(3)
                    + "\nTipo: " + game.input.pointerType;
            } else {
                debug.textContent = "Mueve el dedo para medir el offset";
            }
            requestAnimationFrame(updateDebug);
        }
        requestAnimationFrame(updateDebug);

        document.querySelector("[data-action='start']").addEventListener("click", () => {
            startGame();
        });

        document.querySelector("[data-action='stop']").addEventListener("click", () => {
            game?.stop();
        });

        document.querySelector("[data-action='destroy']").addEventListener("click", () => {
            game?.destroy();
            game = null;
        });
    </script>
</body>
</html>
